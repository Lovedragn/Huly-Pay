# ==============================================================================
# Application Info (Injected into OpenAPI Swagger Documentation)
# ==============================================================================
app.openapi.title=Huly.Pay API Documentation
app.openapi.version=3.0.0
app.openapi.description=REST API endpoints for Huly.Pay backend services

# ==============================================================================
# Spring & Environment Configuration
# ==============================================================================
spring.application.name=huly-pay-backend

# ==============================================================================
# Database & HikariCP Datasource
# ==============================================================================
spring.datasource.url=${DB_URL:${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/hulypay?options=-c%20timezone=UTC}}
spring.datasource.username=${DB_USERNAME:${SUPABASE_DB_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SUPABASE_DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# ==============================================================================
# JPA / Hibernate
# ==============================================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# Security / Supabase OAuth2 JWT Resource Server
# ==============================================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_URL:https://aszhhxnbzstzemyhcjvi.supabase.co}/auth/v1
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256,RS256

# ==============================================================================
# Server & Management
# ==============================================================================
server.port=8080

management.endpoints.web.exposure.include=health,info

# ==============================================================================
# CORS Configuration
# ==============================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,https://app.hulypay.com,https://huly-pay.vercel.app,https://*.vercel.app}

# ==============================================================================
# SpringDoc OpenAPI & Swagger UI
# ==============================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ==============================================================================
# HulyPay Mobile App Version
# ==============================================================================
app.mobile.android.version=${HULYPAY_ANDROID_VERSION:4.0.0}
app.mobile.android.download-url=${HULYPAY_ANDROID_URL:https://github.com/Lovedragn/Huly-Pay/releases/download/v4.0.0/hulypay_v4.0.0.apk}

app.mobile.ios.version=${HULYPAY_IOS_VERSION:4.0.0}
app.mobile.ios.download-url=${HULYPAY_IOS_URL:https://github.com/Lovedragn/Huly-Pay/releases/download/v4.0.0/hulypay_v4.0.0.apk}

app.mobile.minimum-android-version=${HULYPAY_MIN_ANDROID_VERSION:3.0.0}
app.mobile.minimum-ios-version=${HULYPAY_MIN_IOS_VERSION:3.0.0}

app.mobile.release-notes[0]=Lightning-fast QR code scanning & instant UPI payment handoff
app.mobile.release-notes[1]=Interactive spending analytics and real-time budget limit tracker
app.mobile.release-notes[2]=Secure offline ledger synchronization with encrypted SQLite storage
app.mobile.release-notes[3]=Smoother animations, UI refinements, and critical stability fixes

