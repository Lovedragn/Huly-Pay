workflows:
  ios-release:
    name: iOS IPA Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up .env file
        script: |
          echo "Setting up environment file..."
          # If Codemagic Environment variable ENV_FILE is provided, decode or copy it
          if [ -n "$ENV_FILE" ]; then
            echo "$ENV_FILE" > .env
          elif [ ! -f .env ]; then
            touch .env
          fi
      - name: Install Flutter dependencies
        script: |
          flutter packages pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
      - name: Build unsigned iOS IPA
        script: |
          # Prepare Flutter iOS build files and assets
          flutter build ios --release --config-only
          
          # Build unsigned Release Runner.app directly with xcodebuild
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build
          cd ..
          
          # Bundle Runner.app into an unsigned IPA file
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios_derived/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -q HulyPay-unsigned.ipa Payload
          cd ../../..
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/*.ipa
      - "*.ipa"
    publishing:
      email:
        recipients:
          - sujitshrestha811@gmail.com
        notify:
          success: true
          failure: true
