# Render Blueprint — Spring Boot on Render + Supabase as database

services:
  - type: web
    name: hulypay-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore        # closest to India
    healthCheckPath: /actuator/health
    envVars:
      # ── Supabase Database ────────────────────────────────────
      - key: SUPABASE_DB_URL
        sync: false          # set manually in Render dashboard
      - key: SUPABASE_DB_USERNAME
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false

      # ── Supabase Auth ────────────────────────────────────────
      - key: SUPABASE_URL
        sync: false

      # ── Optional ─────────────────────────────────────────────
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DDL_AUTO
        value: update
      - key: PORT
        value: "8080"
