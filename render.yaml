# Render Blueprint — Spring Boot on Render + Supabase as database

services:
  - type: web
    name: hulypay-backend
    runtime: docker
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    plan: free
    region: singapore        # closest to India
    healthCheckPath: /actuator/health
    envVars:
      # ── Supabase Database ────────────────────────────────────
      - key: SUPABASE_DB_URL
        sync: false          # set manually in Render dashboard
      - key: SUPABASE_DB_USERNAME
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false

      # ── Supabase Auth ────────────────────────────────────────
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false

      # ── OAuth Provider Secrets (Server Only) ───────────────────
      - key: GOOGLE_OAUTH_SECRET_ID_WEB
        sync: false
      - key: GITHUB_SECRET_ID
        sync: false

      # ── Optional ─────────────────────────────────────────────
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:5173,http://localhost:8080,https://app.hulypay.com,https://huly-pay.vercel.app,https://*.vercel.app
      - key: DDL_AUTO
        value: update
      - key: PORT
        value: "8080"
