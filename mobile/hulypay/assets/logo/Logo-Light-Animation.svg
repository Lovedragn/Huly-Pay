    .e7 { stroke-dasharray: 6.15; stroke-dashoffset: 6.15; animation-delay: 0.08s; }
    @keyframes erase { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .eraser { animation: none; stroke-dashoffset: 20.3; }
