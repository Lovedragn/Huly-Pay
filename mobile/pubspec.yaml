name: mobile
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  dio: ^5.7.0
  supabase_flutter: ^2.8.3
  flutter_dotenv: ^5.2.1
  mobile_scanner: ^6.0.4
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  google_maps_flutter: ^2.10.0
  sqflite: ^2.4.4
  sqflite_common_ffi: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.0
  fl_chart: ^1.2.0
  fl_heatmap: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3 # <-- Add this


flutter:
  uses-material-design: true

  assets:
    - .env
    - asserts/icon/
    - asserts/logo/
    - asserts/pictures/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "asserts/logo/Logo-Dark.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "asserts/logo/Logo-Dark.png"
  windows:
    generate: true
    image_path: "asserts/logo/Logo-Dark.png"
  macos:
    generate: true
    image_path: "asserts/logo/Logo-Dark.png"


